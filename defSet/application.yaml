# 基础设置
base:
  # 获取天气的城市
  city: 北京
  guide: true
  # 是否要自动检查更新
  checkUpdate: true
  # 是否允许群聊登录
  loginInGroup: false
  # 是否只发送自定义地址
  onlyCustomAddress: false
  # 是否启用Github反代
  githubReverseProxy: false
  # Github反代地址
  githubProxyUrl: ""
  # Git安装白名单，只允许从这些域名安装插件
  gitInstallWhitelist:
    - github.com
    - gitee.com
    - gitlab.com
    - gitcode.com
# 服务器配置
server:
  # 启动地址（仅用于控制台输出）
  # auto 为自动获取IP地址
  host: auto
  # 启动端口号（修改完需要重启）
  # 首次生成配置时会被随机填入一个 20000-59999 的端口，这里只是兜底默认值
  port: 50831
  # 项目部署路径（修改完需要重启）
  mountPrefix: "/"
  # 是否需要拼接端口号
  splicePort: true
  # 网站ICP备案号
  ICPNo: ''
  # 是否整合trss，若开启则会和trss共享端口号，并且默认挂载到 /guoba 路径下
  helloTRSS: true
  # 可信反向代理地址或CIDR。未配置时忽略 X-Forwarded-For，防止伪造来源IP
  trustedProxyCidrs: []
  # 只允许局域网访问面板（共享端口模式下锅巴挂在宿主端口上，这一项仍然生效）
  # 需要从外网访问时，在聊天里发「#开启锅巴外网」，用完发「#关闭锅巴外网」
  lanOnly: true

# 登录安全配置
# passwordHash 由锅巴安全设置生成，禁止手动填写明文密码
# trustedIps 为完成验证码验证后永久信任的客户端IP列表
auth:
  username: ''
  passwordHash: ''
  # 二级密码：进入文件管理 / 数据浏览 / 终端 / 消息记录 / 账号管理前要再输一次
  # 留空表示未开启；由「登录安全」页面设置，禁止手动填写明文
  gatePasswordHash: ''
  # 安全通知接收人：冻结、登录失败重置、二级密码输错等安全事件只通知这个人，
  # 登录验证码也只发给他；#锅巴解冻 / #锅巴重置密码 也只接受这个主人。
  # 留空表示沿用默认（通知全部主人，任一主人都能操作）。
  securityMaster: ''
  trustedIps: []
  # 可信设备：浏览器里存一份长期凭证，换了IP也不用重新验证码
  trustedDevices: []

# 安全加固
security:
  # 未设置二级密码时允许写入的目录（相对 Yunzai 根），其余目录只读。
  # 通过二级密码验证后，可写入根目录内的文件；旧配置中的 '*' 不再授予全目录写入权限。
  fileWriteScopes:
    - data
    - logs
    - temp
  # 网页终端（等同服务器 shell），默认关闭，需要时改成 true
  enableTerminal: false

# jwt配置
jwt:
  # JWT 秘钥（随机生成，非必要请勿修改！）
  secret: ""

# 备份与还原
backup:
  # 是否启用定时自动备份
  enable: false
  # 定时备份周期（cron 表达式，六位，默认每天凌晨4点）
  cron: "0 0 4 * * ?"
  # 自动备份保留份数，超出的从旧到新删（只清理自动备份，手动备份和上传的包不动）
  keep: 5
  # 定时备份要备份哪些条目（条目 key 列表，留空则备份页面上默认勾选的那批）
  keys: []
  # 还原时 clone 插件用的 GitHub 反代候选。
  # 开始 clone 之前会把这些线路连「直连」一起测一遍速（探 git 的 refs 接口，6 秒超时），
  # 挑最快的那条用，结果缓存 5 分钟。留空则只用直连。
  githubProxies:
    - https://github.akams.cn/
    - https://ghfast.top/
    - https://gh-proxy.com/
    - https://ghproxy.net/
    - https://github.moeyy.xyz/
    - https://hub.gitmirror.com/

# 日志文件清理（清的是 Yunzai 的 logs 目录，跟面板里「清空」按钮清内存缓冲是两回事）
log:
  clean:
    # 是否启用定时清理
    enable: true
    # 清理周期（cron 表达式，六位，默认每月 1 号凌晨 4:30）
    cron: "0 30 4 1 * ?"
    # 保留最近多少天的日志文件，更早的归档直接删
    keepDays: 30
    # error.log 是一直在追加的当前文件，删不掉（log4js 还握着句柄），
    # 超过这个大小（MB）就在清理时截断 —— 同样的报错在 command.*.log 里也有一份
    errorLogMaxMB: 5

# 网页截图：群里发个网址，就截一张图预览
# 默认关闭 —— 开了之后服务器会去访问群友随手发的任意地址，请自行斟酌
webShot:
  # 是否启用
  enable: false
  # 只有主人能用。开启时群友发的链接会被直接忽略（不回任何提示）
  # 建议保持开启：截图会让服务器去访问链接，而个别页面会把服务器的网络信息印在图上
  masterOnly: true
  # 页面加载最长等待时间（秒），超时算截图失败
  loadTimeout: 25
  # 页面加载完成后额外等待（秒），等懒加载图片和 JS 渲染。图发出来是白的/骨架屏就调大
  extraWait: 2
  # 是否滚动整页触发懒加载再截图。长页面会慢几秒，关掉更快但图片可能没加载出来
  autoScroll: true
  # 代理地址，访问 github 这类外网站要用，留空则永远直连
  proxy: ""
  # false = 先直连，失败再走代理重试（国内站更快，推荐）
  # true  = 先走代理，失败再直连
  proxyFirst: false
  # 是否拦截内网地址和会回显服务器 IP 的网站，建议保持开启
  # 拦截范围：内网/本机 IP 与域名、数据库等危险端口、查 IP 的站点，
  #           以及页面跳转、iframe 打到上述地址的情况
  # 另外下载类链接（.exe/.zip/.mp4/.pdf 等）一律不截图，这条不受开关控制
  blockPrivate: true
  # 截出来没意义的图不发，只发能看到页面内容的
  # 会跳过四种：要过人机验证的、要登录才能看的、打不开报错的（404 等）、整页空白的
  # 其中人机验证会先换另一条线路再试一次（直连被拦、走代理可能就过了），两条都不行才放弃
  skipUnworthy: true
  # 额外禁止访问的域名，支持后缀匹配，一行一个，例如 example.com
  blacklist: []

# 外观主题
# 面板前端的整体配色。改完刷新页面即可生效，不用重启
# 深浅模式（顶栏那个按钮切的）不在这里 —— 它只存浏览器本地，每台设备各记各的
theme:
  # 内置主题：default（实心）/ glass（毛玻璃，四个面半透明 + 背景模糊）
  themeId: default
  # 主色调。留空用内置默认（深色暖金 / 浅色灰绿），只认 #rrggbb 或 #rgb
  primaryColor: ""
  # antd 组件圆角（px），0 ~ 24
  borderRadius: 10
  # 基础字号（px），12 ~ 20
  fontSize: 14
  # 自定义背景图
  # 只在 themeId 为 glass 时生效，图片放在 config/theme/ 下
  backgrounds:
    dark: ""
    light: ""
