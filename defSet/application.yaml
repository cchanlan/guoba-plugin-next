# 基础设置
base:
  # 获取天气的城市
  city: 北京
  guide: true
  # 是否要自动检查更新
  checkUpdate: true
  # 是否允许群聊登录
  loginInGroup: false
  # 是否只发送自定义地址
  onlyCustomAddress: false
  # 是否启用Github反代
  githubReverseProxy: false
  # Github反代地址
  githubProxyUrl: ""
  # Git安装白名单，只允许从这些域名安装插件
  gitInstallWhitelist:
    - github.com
    - gitee.com
    - gitlab.com
    - gitcode.com
# 服务器配置
server:
  # 启动地址（仅用于控制台输出）
  # auto 为自动获取IP地址
  host: auto
  # 启动端口号（修改完需要重启）
  port: 50831
  # 项目部署路径（修改完需要重启）
  mountPrefix: "/"
  # 是否需要拼接端口号
  splicePort: true
  # 网站ICP备案号
  ICPNo: ''
  # 是否整合trss，若开启则会和trss共享端口号，并且默认挂载到 /guoba 路径下
  helloTRSS: true
  # 可信反向代理地址或CIDR。未配置时忽略 X-Forwarded-For，防止伪造来源IP
  trustedProxyCidrs: []

# 登录安全配置
# passwordHash 由锅巴安全设置生成，禁止手动填写明文密码
# trustedIps 为完成验证码验证后永久信任的客户端IP列表
auth:
  username: ''
  passwordHash: ''
  trustedIps: []
  # 可信设备：浏览器里存一份长期凭证，换了IP也不用重新验证码
  trustedDevices: []

# jwt配置
jwt:
  # JWT 秘钥（随机生成，非必要请勿修改！）
  secret: ""

# 备份与还原
backup:
  # 是否启用定时自动备份
  enable: false
  # 定时备份周期（cron 表达式，六位，默认每天凌晨4点）
  cron: "0 0 4 * * ?"
  # 自动备份保留份数，超出的从旧到新删（只清理自动备份，手动备份和上传的包不动）
  keep: 5
  # 定时备份要备份哪些条目（条目 key 列表，留空则备份页面上默认勾选的那批）
  keys: []
